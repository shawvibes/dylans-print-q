<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Print Quote">
<title>Print Quote</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--ink:#17231f;--mut:#5d6b66;--card:#fff;--line:#d3dbd6;--acc:#0f6b57;--hot:#d9480f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--ink:#e6efe9;--mut:#8fa299;--card:#17211d;--line:#2a3832;--acc:#4fc3a1;--hot:#ff8a4c;--on:#08140f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--ink:#e6efe9;--mut:#8fa299;--card:#17211d;--line:#2a3832;--acc:#4fc3a1;--hot:#ff8a4c;--on:#08140f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,-apple-system,sans-serif;padding:16px 14px 120px;max-width:560px;margin-inline:auto}
h1{font-size:26px;font-weight:800;margin:6px 0 14px;letter-spacing:-.02em}
h2{font-size:15px;font-weight:800;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
input,select{width:100%;margin-top:4px;padding:11px 10px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.row>label{flex:1}
button{font:inherit;font-weight:600;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc)}
button.d{color:var(--hot)}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;font-size:14px}.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.ln{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.ln span:first-child{color:var(--mut)}
.ln.t{border-bottom:0;font-weight:800;color:var(--ink)}.ln.t span:first-child{color:var(--ink)}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--acc);color:var(--on);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;z-index:5}
.bar b{font-size:30px;font-weight:800;letter-spacing:-.02em}.bar small{display:block;opacity:.85;font-size:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
.ov.open{display:flex}.sheet{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .g{margin-bottom:12px}.acts{display:flex;gap:8px}.acts button{flex:1}
</style>
</head>
<body>
<h1>Print quote</h1>

<section>
<h2>Job</h2>
<div class="row"><label>Printer<select id="selP"></select></label><button id="edP">Edit</button><button id="nwP">New</button></div>
<div class="row"><label>Filament<select id="selF"></select></label><button id="edF">Edit</button><button id="nwF">New</button></div>
<div class="g" id="jobF"></div>
<p class="note">Filament, time and hands-on minutes are for one plate. Copies divides the total into a per-piece price.</p>
</section>

<section>
<h2>Labor, profit and risk</h2>
<div class="g" id="setF"></div>
<div class="seg"><button data-m="margin">Margin on price</button><button data-m="markup">Markup on cost</button></div>
<p class="note" id="modeNote"></p>
</section>

<section>
<h2>Breakdown</h2>
<div id="lines"></div>
</section>

<div class="bar"><div><small>Per piece</small><b id="pp">$0.00</b></div><div style="text-align:right"><small id="cp">1 piece</small><b id="tot" style="font-size:20px">$0.00</b></div></div>

<div class="ov" id="ov"><div class="sheet"><h2 id="shT"></h2><div class="g" id="shF"></div><div class="acts"><button id="shX">Cancel</button><button class="d" id="shD">Delete</button><button class="p" id="shS">Save</button></div></div></div>

<script>
const $=s=>document.querySelector(s),KEY='printquote.v1';
let S={printers:[{id:'p1',name:'My printer',cost:2500,life:5000,watts:130}],filaments:[{id:'f1',name:'PLA 1 kg',price:22,kg:1}],
set:{rate:.16,labor:25,mins:15,margin:30,fail:5,mode:'margin'},job:{p:'p1',f:'f1',g:85,purge:0,h:6.5,n:1}};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S={...S,...o,set:{...S.set,...o.set},job:{...S.job,...o.job}}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $$=n=>'$'+(isFinite(n)?n:0).toFixed(2);
const JOB=[['g','Filament used (g)'],['purge','Purge waste (g)'],['h','Print time (hr)'],['n','Copies on plate']];
const SET=[['mins','Hands-on time (min)'],['labor','Labor rate ($/hr)'],['margin','Profit (%)'],['fail','Failure rate (%)'],['rate','Electricity ($/kWh)']];
const CFG={printers:{t:'Printer',f:[['name','Name','text'],['cost','Cost ($)'],['life','Lifespan (hr)'],['watts','Power (W)']],def:{name:'New printer',cost:700,life:5000,watts:130}},
filaments:{t:'Filament',f:[['name','Name','text'],['price','Spool price ($)'],['kg','Spool weight (kg)']],def:{name:'New filament',price:22,kg:1}}};
function fields(el,o,list,key){el.innerHTML=list.map(([k,l,t])=>`<label>${l}<input data-k="${k}" ${t==='text'?'type="text"':'type="number" step="any" inputmode="decimal"'} value="${o[k]}"></label>`).join('')}
function opts(){$('#selP').innerHTML=S.printers.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('#selF').innerHTML=S.filaments.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
 if(!S.printers.some(p=>p.id===S.job.p))S.job.p=S.printers[0].id;if(!S.filaments.some(p=>p.id===S.job.f))S.job.f=S.filaments[0].id;$('#selP').value=S.job.p;$('#selF').value=S.job.f}
function bind(el,o){el.oninput=e=>{const k=e.target.dataset.k;if(k){o[k]=e.target.type==='text'?e.target.value:(parseFloat(e.target.value)||0);if(o===S.job||o===S.set)calc()}}}
function calc(){
 const p=S.printers.find(x=>x.id===S.job.p),f=S.filaments.find(x=>x.id===S.job.f),j=S.job,s=S.set,n=Math.max(1,Math.round(j.n)||1);
 const mat=(j.g+j.purge)/((f.kg*1000)||1)*f.price,el=j.h*p.watts/1000*s.rate,wear=j.h*p.cost/(p.life||1);
 const sub=mat+el+wear,fl=Math.min(s.fail,90)/100,prod=sub/(1-fl),risk=prod-sub,lab=s.mins/60*s.labor,cost=prod+lab;
 const m=s.margin/100,price=s.mode==='margin'?cost/(1-Math.min(m,.95)):cost*(1+m),profit=price-cost;
 const L=[['Material',mat],['Electricity',el],['Machine wear',wear],['Failure allowance',risk],['Labor',lab],['Total cost',cost],['Profit',profit]];
 $('#lines').innerHTML=L.map(([a,b],i)=>`<div class="ln"><span>${a}</span><span>${$$(b)}</span></div>`).join('')+`<div class="ln t"><span>Quote${n>1?' (plate of '+n+')':''}</span><span>${$$(price)}</span></div>`+(price>0?`<p class="note">Profit is ${(profit/price*100).toFixed(0)}% of the price and ${(profit/(cost||1)*100).toFixed(0)}% of cost.</p>`:'');
 $('#pp').textContent=$$(price/n);$('#tot').textContent=$$(price);$('#cp').textContent=n+(n>1?' pieces, plate total':' piece');
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===s.mode));
 $('#modeNote').textContent=s.mode==='margin'?'Price = cost ÷ (1 − profit%). A 30% margin keeps 30% of the price as profit.':'Price = cost × (1 + profit%). A 30% markup keeps about 23% of the price as profit.';
 save()}
let ed=null;
function openEd(kind,id){const c=CFG[kind];let o=id?S[kind].find(x=>x.id===id):{id:'x'+Date.now(),...c.def};ed={kind,o:{...o},isNew:!id};
 $('#shT').textContent=(id?'Edit ':'New ')+c.t.toLowerCase();fields($('#shF'),ed.o,c.f);bind($('#shF'),ed.o);$('#shD').style.display=id&&S[kind].length>1?'':'none';$('#ov').classList.add('open')}
$('#shX').onclick=()=>$('#ov').classList.remove('open');
$('#shS').onclick=()=>{const a=S[ed.kind];if(ed.isNew)a.push(ed.o);else a[a.findIndex(x=>x.id===ed.o.id)]=ed.o;if(ed.kind==='printers')S.job.p=ed.o.id;else S.job.f=ed.o.id;$('#ov').classList.remove('open');opts();calc()};
$('#shD').onclick=()=>{S[ed.kind]=S[ed.kind].filter(x=>x.id!==ed.o.id);$('#ov').classList.remove('open');opts();calc()};
$('#edP').onclick=()=>openEd('printers',S.job.p);$('#nwP').onclick=()=>openEd('printers');
$('#edF').onclick=()=>openEd('filaments',S.job.f);$('#nwF').onclick=()=>openEd('filaments');
$('#selP').onchange=e=>{S.job.p=e.target.value;calc()};$('#selF').onchange=e=>{S.job.f=e.target.value;calc()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.set.mode=b.dataset.m;calc()});
fields($('#jobF'),S.job,JOB);bind($('#jobF'),S.job);fields($('#setF'),S.set,SET);bind($('#setF'),S.set);opts();calc();
</script>
</body>
</html>
